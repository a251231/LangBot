name: Build Plugins

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/feishu_keyword_report_plugin/**'
      - 'plugins/feishu_process_bitable_plugin/**'
      - '.github/workflows/build-plugins.yml'
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-plugins.yml'
      - 'plugins/feishu_keyword_report_plugin/**'
      - 'plugins/feishu_process_bitable_plugin/**'
      - 'src/langbot/__init__.py'

permissions:
  contents: write

jobs:
  build-plugin:
    name: Build ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - feishu_keyword_report_plugin
          - feishu_process_bitable_plugin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install plugin builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install "langbot-plugin>=0.3.8"

      - name: Install plugin dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Build plugin package
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          rm -rf dist
          lbp build -o dist
          ls -lah dist

      - name: Upload plugin package artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package-${{ matrix.plugin }}
          path: plugins/${{ matrix.plugin }}/dist/*.lbpkg
          if-no-files-found: error

  publish-plugin-dist:
    name: Publish plugin packages to repository
    runs-on: ubuntu-latest
    needs: build-plugin
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          path: plugin-artifacts

      - name: Sync plugin dist directories
        shell: bash
        run: |
          plugins=(
            feishu_keyword_report_plugin
            feishu_process_bitable_plugin
          )

          for plugin in "${plugins[@]}"; do
            mkdir -p "plugins/${plugin}/dist"
            rm -f "plugins/${plugin}/dist/"*.lbpkg
            cp "plugin-artifacts/plugin-package-${plugin}/"*.lbpkg "plugins/${plugin}/dist/"
            ls -lah "plugins/${plugin}/dist"
          done

      - name: Commit and push plugin packages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/feishu_keyword_report_plugin/dist plugins/feishu_process_bitable_plugin/dist
          if git diff --cached --quiet; then
            echo "No plugin package changes to commit."
            exit 0
          fi
          git commit -m "chore(plugins): update packaged lbpkg artifacts [skip ci]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
