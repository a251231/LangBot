name: Build Docker Image

on:
  release:
    types: [published]

jobs:
  publish-docker-image:
    if: ${{ !startsWith(github.event.release.tag_name, 'plugins/') && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    name: Build image
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/langbot
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Prepare GITHUB_REF
        run: |
          if [ -z "$GITHUB_REF" ]; then
            export GITHUB_REF=${{ github.ref }}
            echo "$GITHUB_REF"
          fi

      - name: Check version
        id: check_version
        run: |
          echo "$GITHUB_REF"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=$(echo "$GITHUB_REF" | awk -F '/' '{print $3}')
          else
            VERSION="${GITHUB_REF}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Registry
        run: docker login --username=${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }}

      - name: Create Buildx
        run: docker buildx create --name mybuilder --use

      # Every release publishes the default image plus one variant per optional
      # vector-store extra, all from the same Dockerfile:
      #   ${IMAGE_REPO}:<tag>           default image
      #   ${IMAGE_REPO}:<tag>-<extra>   default image + that extra (seekdb, milvus, valkey)
      # Each variant is one extra layer on top of the default image.
      - name: Build for Release
        if: ${{ github.event.release.prerelease == false }}
        env:
          RELEASE_VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          for extra in "" seekdb milvus valkey; do
            if [ -z "$extra" ]; then
              suffix=""; target=(--target langbot)
            else
              suffix="-$extra"; target=(--target langbot-extra --build-arg "LANGBOT_EXTRA=$extra")
            fi
            docker buildx build --build-arg LANGBOT_BUILD_REVISION=${{ github.sha }} --platform linux/arm64,linux/amd64 \
              "${target[@]}" \
              -t "${IMAGE_REPO}:${RELEASE_VERSION}${suffix}" -t "${IMAGE_REPO}:latest${suffix}" . --push
          done

      - name: Build for Pre-release
        if: ${{ github.event.release.prerelease == true }}
        env:
          RELEASE_VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          for extra in "" seekdb milvus valkey; do
            if [ -z "$extra" ]; then
              suffix=""; target=(--target langbot)
            else
              suffix="-$extra"; target=(--target langbot-extra --build-arg "LANGBOT_EXTRA=$extra")
            fi
            tags=(-t "${IMAGE_REPO}:${RELEASE_VERSION}${suffix}")
            if [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              tags+=(-t "${IMAGE_REPO}:beta${suffix}")
            fi
            docker buildx build --build-arg LANGBOT_BUILD_REVISION=${{ github.sha }} --platform linux/arm64,linux/amd64 \
              "${target[@]}" "${tags[@]}" . --push
          done
